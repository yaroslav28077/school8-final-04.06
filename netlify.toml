[build]
  command = "npx @11ty/eleventy"
  publish = "_site"

# Ensure HTML pages are served correctly
# Netlify automatically handles clean URLs (e.g. /appeal/index.html is served at /appeal)
# So no manual redirects are needed for these pages.

[[redirects]]
  from = "/yarik"
  to = "/ostapenko/"
  status = 301

